<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>國語隨堂練習與線上測驗互動網</title>
<style>
  :root {
    --bg: #eef4fa;
    --surface: #ffffff;
    --surface-sub: #f8fafc;
    --primary: #1e40af;
    --primary-hover: #1d4ed8;
    --primary-light: #dbeafe;
    --accent: #d97706;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --correct-bg: #dcfce7;
    --correct-border: #16a34a;
    --correct-text: #14532d;
    --wrong-bg: #fee2e2;
    --wrong-border: #dc2626;
    --wrong-text: #7f1d1d;
    --font-scale: 1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* 頂部導覽列 */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #1e3a8a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-badge {
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 900;
    font-size: 1.2rem;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .brand-title {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  .tool-btn.highlight {
    background: #f59e0b;
    border-color: #d97706;
    color: #fff;
  }
  .tool-btn.highlight:hover {
    background: #d97706;
  }

  main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* 視圖切換容器 */
  .view-panel {
    display: none;
  }
  .view-panel.active {
    display: block;
  }

  /* 首頁 Banner */
  .hero-banner {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    border-radius: 24px;
    padding: 32px 36px;
    margin-bottom: 28px;
    box-shadow: 0 12px 28px rgba(30, 64, 175, 0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .hero-banner h1 {
    font-size: calc(2.3rem * var(--font-scale));
    font-weight: 900;
    margin-bottom: 8px;
  }

  .hero-banner p {
    font-size: calc(1.3rem * var(--font-scale));
    color: #dbeafe;
    font-weight: 600;
  }

  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
  }

  .lesson-card {
    background: var(--surface);
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    transition: all 0.2s ease;
  }

  .lesson-card.ready {
    border-color: #3b82f6;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
  }

  .lesson-card.locked {
    background: #f1f5f9;
    border-style: dashed;
    opacity: 0.78;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .lesson-tag {
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
  }

  .status-pill {
    font-size: 1.05rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .status-pill.ready { background: #dcfce7; color: #15803d; }
  .status-pill.soon { background: #e2e8f0; color: #475569; }

  .lesson-name {
    font-size: calc(2.05rem * var(--font-scale));
    font-weight: 900;
    color: var(--text);
  }

  .lesson-desc {
    font-size: calc(1.15rem * var(--font-scale));
    color: var(--text-muted);
    font-weight: 600;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 140px;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: calc(1.25rem * var(--font-scale));
    font-weight: 900;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn.proj {
    background: #2563eb;
    color: #fff;
  }
  .action-btn.proj:hover { background: #1d4ed8; transform: translateY(-2px); }

  .action-btn.exam {
    background: #059669;
    color: #fff;
  }
  .action-btn.exam:hover { background: #047857; transform: translateY(-2px); }

  .action-btn:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    transform: none;
  }

  /* 台灣標準直書注音排版 */
  .zhuyin-box {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    vertical-align: middle;
    background: #eff6ff;
    border: 2px solid #93c5fd;
    border-radius: 12px;
    padding: 6px 10px 6px 12px;
    margin: 2px 6px;
    line-height: 1;
  }

  .zhuyin-phonemes {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.78em;
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: 0;
  }

  .zhuyin-phonemes span { display: block; text-align: center; }

  .zhuyin-tone-side {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75em;
    font-weight: 900;
    margin-left: 2px;
    line-height: 1;
    align-self: center;
  }

  .zhuyin-tone-light {
    font-size: 0.65em;
    font-weight: 900;
    line-height: 0.6;
    margin-bottom: 2px;
  }

  .highlight-blank {
    display: inline-block;
    min-width: 2.2em;
    padding: 0 10px;
    margin: 0 4px;
    border-bottom: 4px solid #1e40af;
    color: #1e40af;
    text-align: center;
    background: #eff6ff;
    border-radius: 8px 8px 0 0;
  }

  .highlight-quote {
    color: #b45309;
    background: #fef3c7;
    padding: 2px 8px;
    border-radius: 8px;
  }

  /* ==================== 學生考試登入頁面 ==================== */
  .login-card {
    max-width: 620px;
    margin: 40px auto;
    background: #fff;
    border-radius: 24px;
    border: 3.5px solid #2563eb;
    padding: 40px 36px;
    box-shadow: 0 18px 40px rgba(37, 99, 235, 0.12);
  }

  .login-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-header h2 {
    font-size: calc(2.2rem * var(--font-scale));
    color: #1e3a8a;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .login-header p {
    font-size: calc(1.25rem * var(--font-scale));
    color: #64748b;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 22px;
  }
  .form-group label {
    display: block;
    font-size: calc(1.35rem * var(--font-scale));
    font-weight: 900;
    color: #1e293b;
    margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    border: 2.5px solid #cbd5e1;
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 800;
    color: #0f172a;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-control:focus {
    border-color: #2563eb;
    background: #fff;
  }

  .btn-submit-login {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    background: #059669;
    color: #fff;
    font-size: calc(1.6rem * var(--font-scale));
    font-weight: 900;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
    transition: all 0.15s;
    margin-top: 10px;
  }
  .btn-submit-login:hover {
    background: #047857;
    transform: translateY(-2px);
  }

  /* ==================== 學生線上考試介面 ==================== */
  .exam-bar {
    background: #1e3a8a;
    color: #fff;
    border-radius: 18px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .exam-student-badge {
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 900;
    background: #fbbf24;
    color: #1e3a8a;
    padding: 6px 18px;
    border-radius: 999px;
  }
  .exam-progress-text {
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 800;
    color: #dbeafe;
  }

  /* 題號方塊選單 */
  .q-dots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }
  .q-dot {
    height: 48px;
    border-radius: 12px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #334155;
    font-size: calc(1.25rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .q-dot.current {
    background: #1e40af;
    color: #fff;
    border-color: #1e3a8a;
    transform: scale(1.08);
    box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
  }
  .q-dot.answered {
    background: #dbeafe;
    border-color: #3b82f6;
    color: #1e40af;
  }

  /* 巨型字卡 */
  .stage-card {
    background: var(--surface);
    border-radius: 26px;
    padding: 34px 38px;
    border: 3px solid #94a3b8;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    margin-bottom: 24px;
  }

  .question-stem {
    font-size: calc(2.35rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
    line-height: 1.55;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .question-num-pill {
    display: inline-block;
    background: #1e40af;
    color: #fff;
    font-size: calc(1.85rem * var(--font-scale));
    padding: 4px 16px;
    border-radius: 14px;
    margin-right: 14px;
    vertical-align: middle;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }
  .options-grid.single-col {
    grid-template-columns: 1fr;
  }
  @media (max-width: 960px) {
    .options-grid { grid-template-columns: 1fr; }
  }

  .option-btn {
    background: #f8fafc;
    border: 3.5px solid #cbd5e1;
    border-radius: 18px;
    padding: 20px 24px;
    font-size: calc(2rem * var(--font-scale));
    font-weight: 800;
    color: #1e293b;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: all 0.15s ease;
    line-height: 1.4;
  }
  .option-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
    transform: translateY(-2px);
  }
  .option-btn.selected-student {
    background: #dbeafe;
    border-color: #2563eb;
    color: #1e40af;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
  }
  .opt-index {
    flex-shrink: 0;
    width: calc(3rem * var(--font-scale));
    height: calc(3rem * var(--font-scale));
    border-radius: 50%;
    background: #e2e8f0;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 900;
  }
  .option-btn.selected-student .opt-index {
    background: #2563eb;
    color: #fff;
  }

  /* 課堂投影複習時的對錯樣式 */
  .option-btn.correct {
    background: var(--correct-bg) !important;
    border-color: var(--correct-border) !important;
    color: var(--correct-text) !important;
  }
  .option-btn.correct .opt-index { background: #16a34a; color: #fff; }
  .option-btn.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--wrong-border) !important;
    color: var(--wrong-text) !important;
  }
  .option-btn.wrong .opt-index { background: #dc2626; color: #fff; }

  /* 詳解卡片 */
  .explanation-box {
    margin-top: 24px;
    background: #fffbeb;
    border: 3px solid #f59e0b;
    border-radius: 18px;
    padding: 22px 28px;
    display: none;
  }
  .explanation-box.show { display: block; }
  .exp-header {
    font-size: calc(1.6rem * var(--font-scale));
    font-weight: 900;
    color: #b45309;
    margin-bottom: 8px;
  }
  .exp-body {
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 700;
    color: #1e293b;
    line-height: 1.55;
  }

  .stage-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 15px 26px;
    border-radius: 16px;
    font-size: calc(1.45rem * var(--font-scale));
    font-weight: 900;
    border: 2.5px solid #cbd5e1;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-btn:hover:not(:disabled) {
    border-color: #1e40af;
    background: #eff6ff;
  }
  .ctrl-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .ctrl-btn.primary {
    background: #1e40af;
    color: #fff;
    border-color: #1e3a8a;
  }
  .ctrl-btn.primary:hover:not(:disabled) { background: #1d4ed8; }
  .ctrl-btn.success {
    background: #059669;
    color: #fff;
    border-color: #047857;
  }
  .ctrl-btn.success:hover:not(:disabled) { background: #047857; }
  .ctrl-btn.reveal {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }

  /* ==================== 測驗成績與訂正畫面 ==================== */
  .result-card {
    max-width: 800px;
    margin: 30px auto;
    background: #fff;
    border-radius: 26px;
    border: 4px solid #059669;
    padding: 40px;
    text-align: center;
    box-shadow: 0 16px 36px rgba(5, 150, 105, 0.15);
  }
  .result-score-title {
    font-size: calc(1.8rem * var(--font-scale));
    color: #065f46;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .result-score-num {
    font-size: calc(4.8rem * var(--font-scale));
    font-weight: 900;
    color: #059669;
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .result-desc {
    font-size: calc(1.4rem * var(--font-scale));
    color: #475569;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .result-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  /* 訂正試卷列表 */
  .review-sheet-wrap {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .keyboard-hint {
    text-align: center;
    margin-top: 22px;
    color: #64748b;
    font-size: 1.15rem;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()" title="返回課次選擇首頁">
    <span class="brand-badge">潮和402 國語隨堂練</span>
    <span class="brand-title">第七課～第十二課 課堂互動與線上測驗</span>
  </div>
  <div class="toolbar">
    <button class="tool-btn" id="btn-home" onclick="goHome()" style="display:none;">🏠 回首頁</button>
    <a class="tool-btn highlight" href="teacher.html" target="_blank">👩‍🏫 教師後台</a>
    <button class="tool-btn" onclick="adjustFontSize(-0.1)" title="縮小字體">A-</button>
    <button class="tool-btn" onclick="adjustFontSize(0)" title="標準字體">標準</button>
    <button class="tool-btn" onclick="adjustFontSize(0.12)" title="放大字體">A+</button>
    <button class="tool-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>
</header>

<main>
  <!-- 視圖 1：課次選擇首頁 -->
  <section id="view-home" class="view-panel active">
    <div class="hero-banner">
      <div>
        <h1>國語文隨堂練習與線上測驗</h1>
        <p>提供「課堂大字投影複習」與「學生線上考試＋後台接收數據」雙模式</p>
      </div>
      <a class="tool-btn highlight" href="teacher.html" style="font-size:1.3rem;padding:12px 24px;">📊 進入教師成績後台 →</a>
    </div>

    <div class="lesson-grid" id="lesson-grid"></div>
  </section>

  <!-- 視圖 2：學生考試登入畫面（座號 1~29 下拉選單） -->
  <section id="view-exam-login" class="view-panel">
    <div class="login-card">
      <div class="login-header">
        <h2 id="login-lesson-title">第七課 到此「藝」遊</h2>
        <p>請確認您的班級與座號，即可開始進行線上測驗</p>
      </div>
      <form id="student-login-form" onsubmit="startStudentExam(event)">
        <div class="form-group">
          <label for="student-class">班級</label>
          <select id="student-class" class="form-control">
            <option value="4-2" selected>四年二班 (4-2)</option>
            <option value="4-1">四年一班 (4-1)</option>
            <option value="4-3">四年三班 (4-3)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="student-seat">座號（1～29 號）</label>
          <select id="student-seat" class="form-control" required>
            <option value="" disabled selected>-- 請選擇您的座號 --</option>
          </select>
        </div>
        <div class="form-group">
          <label for="student-name">姓名（選填）</label>
          <input type="text" id="student-name" class="form-control" placeholder="請輸入姓名（可不填）">
        </div>
        <button type="submit" class="btn-submit-login">🚀 開始線上測驗</button>
        <button type="button" class="ctrl-btn" style="width:100%;margin-top:14px;justify-content:center;" onclick="goHome()">取消，返回首頁</button>
      </form>
    </div>
  </section>

  <!-- 視圖 3：課堂投影複習 模式（即時點擊看答案、大字投影） -->
  <section id="view-projector" class="view-panel">
    <div style="background:#fff;border-radius:18px;padding:16px 24px;margin-bottom:20px;border:2px solid #cbd5e1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">

const CIRCLED_NUMS = ["①", "②", "③", "④"];
let currentLesson = null;
let currentMode = "home"; // 'home' | 'projector' | 'exam'
let fontScale = 1;

// 注音直書排版
function renderZhuyinCluster(cluster) {
  let tone = "";
  let phonemes = cluster;
  const lastChar = cluster.slice(-1);
  if (["ˊ", "ˇ", "ˋ", "˙"].includes(lastChar)) {
    tone = lastChar;
    phonemes = cluster.slice(0, -1);
  }
  const charsHtml = Array.from(phonemes).map(ch => `<span>${ch}</span>`).join("");
  const lightToneHtml = (tone === "˙") ? `<span class="zhuyin-tone-light">˙</span>` : "";
  const sideToneHtml = (tone && tone !== "˙") ? `<span class="zhuyin-tone-side">${tone}</span>` : "";
  return `<span class="zhuyin-box"><span class="zhuyin-phonemes">${lightToneHtml}${charsHtml}</span>${sideToneHtml}</span>`;
}

function formatStemHTML(text) {
  return text
    .replace(/（　）/g, '<span class="highlight-blank">　</span>')
    .replace(/【([^】]+)】/g, '<span class="highlight-quote">【$1】</span>')
    .replace(/([ㄅ-ㄩ]+[ˊˇˋ˙]?)/g, (match) => renderZhuyinCluster(match));
}

// 換頁控制器
function showView(viewId) {
  document.querySelectorAll(".view-panel").forEach(p => p.classList.remove("active"));
  document.getElementById(viewId).classList.add("active");
  document.getElementById("btn-home").style.display = (viewId === "view-home") ? "none" : "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function goHome() {
  currentLesson = null;
  currentMode = "home";
  showView("view-home");
}

// ==================== 首頁渲染 ====================

// 初始化 1~29 座號選單
function initSeatSelect() {

// ==================== 模式一：課堂投影複習 ====================
let projQIndex = 0;
let projState = {};
let isProjListMode = false;

function openProjectorMode(lessonId) {
  currentLesson = LESSONS.find(l => l.id === lessonId);
  if (!currentLesson || !currentLesson.ready) return;
  currentMode = "projector";
  projQIndex = 0;
  projState = {};
  isProjListMode = false;

  document.getElementById("proj-lesson-title").textContent = `${currentLesson.lessonNum}《${currentLesson.title}》課堂投影練習`;
  document.getElementById("proj-single-container").style.display = "block";
  document.getElementById("proj-list-container").style.display = "none";
  document.getElementById("btn-proj-list-toggle").textContent = "📋 切換全卷檢視";

  renderProjStage();
  showView("view-projector");
}

function renderProjStage() {
  const q = currentLesson.questions[projQIndex];
  const st = projState[projQIndex] || { selected: null, revealed: false };

  document.getElementById("proj-section-badge").textContent = q.section;

  // 渲染題號導覽
  const dotsEl = document.getElementById("proj-q-dots");
  dotsEl.innerHTML = currentLesson.questions.map((item, idx) => {
    let cls = "q-dot";
    if (idx === projQIndex) cls += " current";
    const s = projState[idx];
    if (s && s.selected !== null) {
      cls += (s.selected === item.answer) ? " answered correct" : " answered wrong";
    }
    return `<button class="${cls}" onclick="jumpProjQuestion(${idx})">${idx + 1}</button>`;
  }).join("");

  document.getElementById("proj-stem").innerHTML =
    `<span class="question-num-pill">第 ${projQIndex + 1} 題</span>${formatStemHTML(q.stem)}`;

  const optsEl = document.getElementById("proj-options");
  optsEl.className = "options-grid" + (q.singleCol || q.options.some(o => o.length > 16) ? " single-col" : "");
  optsEl.innerHTML = q.options.map((optText, optIdx) => {
    let btnClass = "option-btn";
    if (st.revealed) {
      if (optIdx === q.answer) btnClass += " correct";
      else if (st.selected === optIdx) btnClass += " wrong";
    }
    return `
      <button class="${btnClass}" onclick="selectProjOption(${optIdx})">
        <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
        <span>${formatStemHTML(optText)}</span>
      </button>
    `;
  }).join("");

  const expBox = document.getElementById("proj-exp");
  if (st.revealed) {
    expBox.classList.add("show");
    document.getElementById("proj-exp-header").textContent =
      (st.selected === q.answer) ? `🎉 答對了！正確答案是 ${CIRCLED_NUMS[q.answer]}` :
      (st.selected === null) ? `💡 正確答案：${CIRCLED_NUMS[q.answer]}` :
      `❌ 答錯囉！正確答案是 ${CIRCLED_NUMS[q.answer]}`;
    document.getElementById("proj-exp-body").innerHTML = formatStemHTML(q.explanation);
  } else {
    expBox.classList.remove("show");
  }

  document.getElementById("btn-proj-prev").disabled = (projQIndex === 0);
  document.getElementById("btn-proj-next").disabled = (projQIndex === currentLesson.questions.length - 1);
}

function selectProjOption(optIdx) {
  projState[projQIndex] = { selected: optIdx, revealed: true };
  renderProjStage();
}

function revealProjAnswer() {
  const cur = projState[projQIndex] || { selected: null, revealed: false };
  projState[projQIndex] = { selected: cur.selected, revealed: !cur.revealed };
  renderProjStage();
}

function resetProjQuestion() {
  delete projState[projQIndex];
  renderProjStage();
}

function prevProjQuestion() {
  if (projQIndex > 0) { projQIndex--; renderProjStage(); }
}
function nextProjQuestion() {
  if (projQIndex < currentLesson.questions.length - 1) { projQIndex++; renderProjStage(); }
}
function jumpProjQuestion(idx) {
  projQIndex = idx;
  renderProjStage();
}

function toggleProjListMode() {
  isProjListMode = !isProjListMode;
  const single = document.getElementById("proj-single-container");
  const list = document.getElementById("proj-list-container");
  const btn = document.getElementById("btn-proj-list-toggle");

  if (isProjListMode) {
    btn.textContent = "🖥 切換單題投影";
    single.style.display = "none";
    list.style.display = "flex";
    renderProjList();
  } else {
    btn.textContent = "📋 切換全卷檢視";
    single.style.display = "block";
    list.style.display = "none";
    renderProjStage();
  }
}

function renderProjList() {
  const container = document.getElementById("proj-list-container");
  let html = "";
  currentLesson.questions.forEach((q, idx) => {
    const st = projState[idx] || { selected: null, revealed: false };
    const singleCol = q.singleCol || q.options.some(o => o.length > 16);
    const optsHtml = q.options.map((optText, optIdx) => {
      let cls = "option-btn";
      if (st.revealed) {
        if (optIdx === q.answer) cls += " correct";
        else if (st.selected === optIdx) cls += " wrong";
      }
      return `
        <button class="${cls}" onclick="projState[${idx}]={selected:${optIdx},revealed:true};renderProjList();">
          <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
          <span>${formatStemHTML(optText)}</span>
        </button>
      `;
    }).join("");

    html += `
      <div class="stage-card">
        <div class="question-stem">
          <span class="question-num-pill">第 ${idx + 1} 題</span>${formatStemHTML(q.stem)}
        </div>
        <div class="options-grid ${singleCol ? 'single-col' : ''}">${optsHtml}</div>
        <div class="explanation-box ${st.revealed ? 'show' : ''}">
          <div class="exp-header">💡 正確答案：${CIRCLED_NUMS[q.answer]}</div>
          <div class="exp-body">${formatStemHTML(q.explanation)}</div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// ==================== 模式二：學生線上測驗 ====================
let currentStudent = { class: "4-2", seat: 1, name: "" };
let examQIndex = 0;
let examAnswers = {}; // { qIndex: optIdx (0~3) }

function openExamLogin(lessonId) {
  currentLesson = LESSONS.find(l => l.id === lessonId);
  if (!currentLesson || !currentLesson.ready) return;
  document.getElementById("login-lesson-title").textContent = `${currentLesson.lessonNum}《${currentLesson.title}》線上測驗`;
  document.getElementById("student-seat").value = "";
  document.getElementById("student-name").value = "";
  showView("view-exam-login");
}

function startStudentExam(e) {
  e.preventDefault();
  const seatVal = document.getElementById("student-seat").value;
  if (!seatVal) {
    alert("請先選擇您的座號！");
    return;
  }
  currentStudent = {
    class: document.getElementById("student-class").value,
    seat: parseInt(seatVal, 10),
    name: document.getElementById("student-name").value.trim()
  };

  examQIndex = 0;
  examAnswers = {};
  currentMode = "exam";

  const num = currentStudent.seat < 10 ? `0${currentStudent.seat}` : `${currentStudent.seat}`;
  document.getElementById("exam-badge-info").textContent =
    `${currentStudent.class} 班 ${num} 號 ${currentStudent.name ? ' ' + currentStudent.name : ''}`;
  document.getElementById("exam-test-lesson-title").textContent =
    `${currentLesson.lessonNum}《${currentLesson.title}》測驗`;

  renderExamStage();
  showView("view-exam-test");
}

function renderExamStage() {
  const q = currentLesson.questions[examQIndex];
  const selectedOpt = examAnswers[examQIndex];

  // 更新進度
  const answeredCount = Object.keys(examAnswers).length;
  document.getElementById("exam-progress-text").textContent =
    `已作答 ${answeredCount} / ${currentLesson.questions.length} 題`;

  // 渲染題號導覽
  const dotsEl = document.getElementById("exam-q-dots");
  dotsEl.innerHTML = currentLesson.questions.map((item, idx) => {
    let cls = "q-dot";
    if (idx === examQIndex) cls += " current";
    if (examAnswers[idx] !== undefined) cls += " answered";
    return `<button class="${cls}" onclick="jumpExamQuestion(${idx})">${idx + 1}</button>`;
  }).join("");

  document.getElementById("exam-stem").innerHTML =
    `<span class="question-num-pill">第 ${examQIndex + 1} 題</span>${formatStemHTML(q.stem)}`;

  const optsEl = document.getElementById("exam-options");
  optsEl.className = "options-grid" + (q.singleCol || q.options.some(o => o.length > 16) ? " single-col" : "");
  optsEl.innerHTML = q.options.map((optText, optIdx) => {
    const isSel = (selectedOpt === optIdx);
    return `
      <button class="option-btn ${isSel ? 'selected-student' : ''}" onclick="selectExamOption(${optIdx})">
        <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
        <span>${formatStemHTML(optText)}</span>
      </button>
    `;
  }).join("");

  document.getElementById("btn-exam-prev").disabled = (examQIndex === 0);
  document.getElementById("btn-exam-next").disabled = (examQIndex === currentLesson.questions.length - 1);
}

function selectExamOption(optIdx) {
  examAnswers[examQIndex] = optIdx;
  renderExamStage();
}

function prevExamQuestion() {
  if (examQIndex > 0) { examQIndex--; renderExamStage(); }
}
function nextExamQuestion() {
  if (examQIndex < currentLesson.questions.length - 1) { examQIndex++; renderExamStage(); }
}
function jumpExamQuestion(idx) {
  examQIndex = idx;
  renderExamStage();
}

// 送出並檢查
async function confirmSubmitExam() {
  const total = currentLesson.questions.length;
  const missing = [];
  for (let i = 0; i < total; i++) {
    if (examAnswers[i] === undefined) missing.push(i + 1);
  }

  if (missing.length > 0) {
    const ok = confirm(`注意：您尚有第 ${missing.join("、")} 題尚未作答！\n\n確定現在就要交卷嗎？`);
    if (!ok) return;
  } else {
    if (!confirm("確定要送出試卷嗎？送出後即完成測驗。")) return;
  }

  const submitBtn = document.getElementById("btn-submit-exam");
  submitBtn.disabled = true;
  submitBtn.textContent = "⏳ 傳送成績中...";

  // 計算成績
  let correctCount = 0;
  const answersArr = [];
  for (let i = 0; i < total; i++) {
    const chosen = examAnswers[i];
    if (chosen !== undefined) {
      answersArr.push(chosen + 1); // 轉為 1~4
      if (chosen === currentLesson.questions[i].answer) correctCount++;
    } else {
      answersArr.push(0); // 0 代表未作答
    }
  }

  const scaledScore = Math.round((correctCount / total) * 100);
  const clientId = (crypto.randomUUID ? crypto.randomUUID() : `cid-${Date.now()}-${Math.random().toString(36).slice(2)}`);

  const payload = {
    exam_id: currentLesson.examId || `${currentLesson.id}-chinese`,
    grade: 4,
    subject: "chinese",
    year: 114,
    class: currentStudent.class,
    seat: currentStudent.seat,
    name: currentStudent.name || null,
    answers: answersArr,
    score: correctCount,
    total: total,
    is_deleted: false,
    client_id: clientId
  };

  // 傳送到 Supabase
  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/submissions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok && res.status !== 409) {
      console.warn("後端儲存狀態碼:", res.status);
    }
  } catch (err) {
    console.error("傳送至 Supabase 錯誤:", err);
  }

  // 本機 localStorage 備份一份
  const localBackup = JSON.parse(localStorage.getItem("chinese_quiz_submissions") || "[]");
  localBackup.push({ ...payload, created_at: new Date().toISOString() });
  localStorage.setItem("chinese_quiz_submissions", JSON.stringify(localBackup));

  // 顯示結果
  submitBtn.disabled = false;
  submitBtn.textContent = "📝 檢查並交卷";

  document.getElementById("res-student-header").textContent =
    `🎉 ${currentStudent.class} 班 ${currentStudent.seat} 號 ${currentStudent.name ? currentStudent.name : ''} 測驗已送出！`;
  document.getElementById("res-score-num").textContent = `${scaledScore} 分`;
  document.getElementById("res-desc").textContent =
    `共 ${total} 題，答對 ${correctCount} 題，答錯 ${total - correctCount} 題`;

  renderCorrectionSheet();
  showView("view-exam-result");
}

// 產生學生個人訂正詳解清單
function renderCorrectionSheet() {
  const container = document.getElementById("correction-sheet");
  let html = `<h2 style="font-size:2rem;font-weight:900;color:#1e3a8a;margin-bottom:12px;">📑 試卷題目訂正與詳解</h2>`;

  currentLesson.questions.forEach((q, idx) => {
    const studentChoice = examAnswers[idx]; // 0~3 or undefined
    const isCorrect = (studentChoice === q.answer);
    const singleCol = q.singleCol || q.options.some(o => o.length > 16);

    const optsHtml = q.options.map((optText, optIdx) => {
      let cls = "option-btn";
      if (optIdx === q.answer) cls += " correct";
      else if (studentChoice === optIdx) cls += " wrong";
      return `
        <div class="${cls}">
          <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
          <span>${formatStemHTML(optText)}</span>
        </div>
      `;
    }).join("");

    const statusTag = (studentChoice === undefined)
      ? `<span style="background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">未作答</span>`
      : isCorrect
      ? `<span style="background:#dcfce7;color:#16a34a;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">✅ 答對</span>`
      : `<span style="background:#fee2e2;color:#dc2626;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">❌ 答錯（您的答案：${CIRCLED_NUMS[studentChoice]}）</span>`;

    html += `
      <div class="stage-card">
        <div class="question-stem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
            <span class="question-num-pill">第 ${idx + 1} 題</span>
            ${statusTag}
          </div>
          ${formatStemHTML(q.stem)}
        </div>
        <div class="options-grid ${singleCol ? 'single-col' : ''}">${optsHtml}</div>
        <div class="explanation-box show" style="margin-top:20px;">
          <div class="exp-header">💡 正確解答：${CIRCLED_NUMS[q.answer]}</div>
          <div class="exp-body">${formatStemHTML(q.explanation)}</div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function showCorrectionSheet() {
  const sheet = document.getElementById("correction-sheet");
  sheet.style.display = (sheet.style.display === "none") ? "flex" : "none";
  if (sheet.style.display === "flex") {
    sheet.scrollIntoView({ behavior: "smooth" });
  }
}

// ==================== 字級與全螢幕輔助 ====================
function adjustFontSize(delta) {
  if (delta === 0) {
    fontScale = 1;
  } else {
    fontScale = Math.min(1.45, Math.max(0.8, +(fontScale + delta).toFixed(2)));
  }
  document.documentElement.style.setProperty("--font-scale", fontScale);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// 課堂鍵盤快捷鍵
window.addEventListener("keydown", (e) => {
  if (currentMode === "projector" && !isProjListMode) {
    if (e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault(); nextProjQuestion();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); prevProjQuestion();
    } else if (["1", "2", "3", "4"].includes(e.key)) {
      e.preventDefault(); selectProjOption(parseInt(e.key, 10) - 1);
    } else if (e.key === " ") {
      e.preventDefault(); revealProjAnswer();
    }
  } else if (currentMode === "exam") {
    if (["1", "2", "3", "4"].includes(e.key)) {
      selectExamOption(parseInt(e.key, 10) - 1);
    } else if (e.key === "ArrowRight") {
      nextExamQuestion();
    } else if (e.key === "ArrowLeft") {
      prevExamQuestion();
    }
  }
});

// 初始化
initSeatSelect();
renderHome();
</script>

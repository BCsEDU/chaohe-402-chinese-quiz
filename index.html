<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>國語隨堂練習與線上測驗互動網</title>
<style>
  :root {
    --bg: #eef4fa;
    --surface: #ffffff;
    --surface-sub: #f8fafc;
    --primary: #1e40af;
    --primary-hover: #1d4ed8;
    --primary-light: #dbeafe;
    --accent: #d97706;
    --text: #0f172a;
    --text-muted: #475569;
    --border: #cbd5e1;
    --correct-bg: #dcfce7;
    --correct-border: #16a34a;
    --correct-text: #14532d;
    --wrong-bg: #fee2e2;
    --wrong-border: #dc2626;
    --wrong-text: #7f1d1d;
    --font-scale: 1;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* 頂部導覽列 */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #1e3a8a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .brand-badge {
    background: #fbbf24;
    color: #1e3a8a;
    font-weight: 900;
    font-size: 1.2rem;
    padding: 4px 12px;
    border-radius: 999px;
  }

  .brand-title {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tool-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    border: 1.5px solid rgba(255, 255, 255, 0.35);
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
  }

  .tool-btn:hover {
    background: rgba(255, 255, 255, 0.28);
    transform: translateY(-1px);
  }

  .tool-btn.highlight {
    background: #f59e0b;
    border-color: #d97706;
    color: #fff;
  }
  .tool-btn.highlight:hover {
    background: #d97706;
  }

  main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* 視圖切換容器 */
  .view-panel {
    display: none;
  }
  .view-panel.active {
    display: block;
  }

  /* 首頁 Banner */
  .hero-banner {
    background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
    color: #fff;
    border-radius: 24px;
    padding: 32px 36px;
    margin-bottom: 28px;
    box-shadow: 0 12px 28px rgba(30, 64, 175, 0.18);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
  }

  .hero-banner h1 {
    font-size: calc(2.3rem * var(--font-scale));
    font-weight: 900;
    margin-bottom: 8px;
  }

  .hero-banner p {
    font-size: calc(1.3rem * var(--font-scale));
    color: #dbeafe;
    font-weight: 600;
  }

  .lesson-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 24px;
  }

  .lesson-card {
    background: var(--surface);
    border: 3px solid #cbd5e1;
    border-radius: 22px;
    padding: 28px 26px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 18px;
    transition: all 0.2s ease;
  }

  .lesson-card.ready {
    border-color: #3b82f6;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
  }

  .lesson-card.locked {
    background: #f1f5f9;
    border-style: dashed;
    opacity: 0.78;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .lesson-tag {
    font-size: calc(1.2rem * var(--font-scale));
    font-weight: 900;
    padding: 5px 14px;
    border-radius: 999px;
    background: #dbeafe;
    color: #1e40af;
  }

  .status-pill {
    font-size: 1.05rem;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 999px;
  }
  .status-pill.ready { background: #dcfce7; color: #15803d; }
  .status-pill.soon { background: #e2e8f0; color: #475569; }

  .lesson-name {
    font-size: calc(2.05rem * var(--font-scale));
    font-weight: 900;
    color: var(--text);
  }

  .lesson-desc {
    font-size: calc(1.15rem * var(--font-scale));
    color: var(--text-muted);
    font-weight: 600;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .action-btn {
    flex: 1;
    min-width: 140px;
    padding: 14px 16px;
    border-radius: 14px;
    font-size: calc(1.25rem * var(--font-scale));
    font-weight: 900;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .action-btn.proj {
    background: #2563eb;
    color: #fff;
  }
  .action-btn.proj:hover { background: #1d4ed8; transform: translateY(-2px); }

  .action-btn.exam {
    background: #059669;
    color: #fff;
  }
  .action-btn.exam:hover { background: #047857; transform: translateY(-2px); }

  .action-btn:disabled {
    background: #cbd5e1;
    color: #64748b;
    cursor: not-allowed;
    transform: none;
  }

  /* 台灣標準直書注音排版（SVG 清晰聲調） */
  .zhuyin-box {
    display: inline-flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: center;
    vertical-align: middle;
    background: #eff6ff;
    color: #0f172a;
    border: 2px solid #93c5fd;
    border-radius: 12px;
    padding: 6px 9px 6px 10px;
    margin: 2px 4px;
    line-height: 1;
  }

  .zhuyin-phonemes {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.85em;
    line-height: 1.08;
    font-weight: 900;
    letter-spacing: 0;
  }

  .zhuyin-phonemes span { display: block; text-align: center; }

  .zhuyin-tone-side {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.65em;
    height: 0.75em;
    margin-left: 3px;
    margin-bottom: 0.22em;
    color: #0f172a;
    flex-shrink: 0;
  }

  .zhuyin-tone-side svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
  }

  .zhuyin-tone-light {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 0.42em;
    height: 0.42em;
    margin-bottom: 3px;
    color: #0f172a;
  }

  .zhuyin-tone-light svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .highlight-blank {
    display: inline-block;
    min-width: 2.2em;
    padding: 0 10px;
    margin: 0 4px;
    border-bottom: 4px solid #1e40af;
    color: #1e40af;
    text-align: center;
    background: #eff6ff;
    border-radius: 8px 8px 0 0;
  }

  .highlight-quote {
    color: #b45309;
    background: #fef3c7;
    padding: 2px 8px;
    border-radius: 8px;
  }

  /* ==================== 學生考試登入頁面 ==================== */
  .login-card {
    max-width: 620px;
    margin: 40px auto;
    background: #fff;
    border-radius: 24px;
    border: 3.5px solid #2563eb;
    padding: 40px 36px;
    box-shadow: 0 18px 40px rgba(37, 99, 235, 0.12);
  }

  .login-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .login-header h2 {
    font-size: calc(2.2rem * var(--font-scale));
    color: #1e3a8a;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .login-header p {
    font-size: calc(1.25rem * var(--font-scale));
    color: #64748b;
    font-weight: 600;
  }

  .form-group {
    margin-bottom: 22px;
  }
  .form-group label {
    display: block;
    font-size: calc(1.35rem * var(--font-scale));
    font-weight: 900;
    color: #1e293b;
    margin-bottom: 8px;
  }
  .form-control {
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    border: 2.5px solid #cbd5e1;
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 800;
    color: #0f172a;
    background: #f8fafc;
    outline: none;
    transition: border-color 0.15s;
  }
  .form-control:focus {
    border-color: #2563eb;
    background: #fff;
  }

  .btn-submit-login {
    width: 100%;
    padding: 18px;
    border-radius: 16px;
    background: #059669;
    color: #fff;
    font-size: calc(1.6rem * var(--font-scale));
    font-weight: 900;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
    transition: all 0.15s;
    margin-top: 10px;
  }
  .btn-submit-login:hover {
    background: #047857;
    transform: translateY(-2px);
  }

  /* ==================== 學生線上考試介面 ==================== */
  .exam-bar {
    background: #1e3a8a;
    color: #fff;
    border-radius: 18px;
    padding: 18px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .exam-student-badge {
    font-size: calc(1.4rem * var(--font-scale));
    font-weight: 900;
    background: #fbbf24;
    color: #1e3a8a;
    padding: 6px 18px;
    border-radius: 999px;
  }
  .exam-progress-text {
    font-size: calc(1.3rem * var(--font-scale));
    font-weight: 800;
    color: #dbeafe;
  }

  /* 題號方塊選單 */
  .q-dots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
    gap: 8px;
    margin-bottom: 22px;
  }
  .q-dot {
    height: 48px;
    border-radius: 12px;
    border: 2px solid #cbd5e1;
    background: #f8fafc;
    color: #334155;
    font-size: calc(1.25rem * var(--font-scale));
    font-weight: 900;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .q-dot.current {
    background: #1e40af;
    color: #fff;
    border-color: #1e3a8a;
    transform: scale(1.08);
    box-shadow: 0 4px 10px rgba(30, 64, 175, 0.3);
  }
  .q-dot.answered {
    background: #dbeafe;
    border-color: #3b82f6;
    color: #1e40af;
  }

  /* 巨型字卡 */
  .stage-card {
    background: var(--surface);
    border-radius: 26px;
    padding: 34px 38px;
    border: 3px solid #94a3b8;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    margin-bottom: 24px;
  }

  .question-stem {
    font-size: calc(2.35rem * var(--font-scale));
    font-weight: 900;
    color: #0f172a;
    line-height: 1.55;
    margin-bottom: 30px;
    letter-spacing: 0.5px;
  }

  .question-num-pill {
    display: inline-block;
    background: #1e40af;
    color: #fff;
    font-size: calc(1.85rem * var(--font-scale));
    padding: 4px 16px;
    border-radius: 14px;
    margin-right: 14px;
    vertical-align: middle;
  }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }
  .options-grid.single-col {
    grid-template-columns: 1fr;
  }
  @media (max-width: 960px) {
    .options-grid { grid-template-columns: 1fr; }
  }

  .option-btn {
    background: #f8fafc;
    border: 3.5px solid #cbd5e1;
    border-radius: 18px;
    padding: 20px 24px;
    font-size: calc(2rem * var(--font-scale));
    font-weight: 800;
    color: #1e293b;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: all 0.15s ease;
    line-height: 1.4;
  }
  .option-btn:hover {
    border-color: #2563eb;
    background: #eff6ff;
    transform: translateY(-2px);
  }
  .option-btn.selected-student {
    background: #dbeafe;
    border-color: #2563eb;
    color: #1e40af;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
  }
  .opt-index {
    flex-shrink: 0;
    width: calc(3rem * var(--font-scale));
    height: calc(3rem * var(--font-scale));
    border-radius: 50%;
    background: #e2e8f0;
    color: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 900;
  }
  .option-btn.selected-student .opt-index {
    background: #2563eb;
    color: #fff;
  }

  /* 課堂投影複習時的對錯樣式 */
  .option-btn.correct {
    background: var(--correct-bg) !important;
    border-color: var(--correct-border) !important;
    color: var(--correct-text) !important;
  }
  .option-btn.correct .opt-index { background: #16a34a; color: #fff; }
  .option-btn.wrong {
    background: var(--wrong-bg) !important;
    border-color: var(--wrong-border) !important;
    color: var(--wrong-text) !important;
  }
  .option-btn.wrong .opt-index { background: #dc2626; color: #fff; }

  /* 詳解卡片 */
  .explanation-box {
    margin-top: 24px;
    background: #fffbeb;
    border: 3px solid #f59e0b;
    border-radius: 18px;
    padding: 22px 28px;
    display: none;
  }
  .explanation-box.show { display: block; }
  .exp-header {
    font-size: calc(1.6rem * var(--font-scale));
    font-weight: 900;
    color: #b45309;
    margin-bottom: 8px;
  }
  .exp-body {
    font-size: calc(1.8rem * var(--font-scale));
    font-weight: 700;
    color: #1e293b;
    line-height: 1.55;
  }

  .stage-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 15px 26px;
    border-radius: 16px;
    font-size: calc(1.45rem * var(--font-scale));
    font-weight: 900;
    border: 2.5px solid #cbd5e1;
    background: #fff;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .ctrl-btn:hover:not(:disabled) {
    border-color: #1e40af;
    background: #eff6ff;
  }
  .ctrl-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .ctrl-btn.primary {
    background: #1e40af;
    color: #fff;
    border-color: #1e3a8a;
  }
  .ctrl-btn.primary:hover:not(:disabled) { background: #1d4ed8; }
  .ctrl-btn.success {
    background: #059669;
    color: #fff;
    border-color: #047857;
  }
  .ctrl-btn.success:hover:not(:disabled) { background: #047857; }
  .ctrl-btn.reveal {
    background: #f59e0b;
    color: #fff;
    border-color: #d97706;
  }

  /* ==================== 測驗成績與訂正畫面 ==================== */
  .result-card {
    max-width: 800px;
    margin: 30px auto;
    background: #fff;
    border-radius: 26px;
    border: 4px solid #059669;
    padding: 40px;
    text-align: center;
    box-shadow: 0 16px 36px rgba(5, 150, 105, 0.15);
  }
  .result-score-title {
    font-size: calc(1.8rem * var(--font-scale));
    color: #065f46;
    font-weight: 900;
    margin-bottom: 12px;
  }
  .result-score-num {
    font-size: calc(4.8rem * var(--font-scale));
    font-weight: 900;
    color: #059669;
    line-height: 1.1;
    margin-bottom: 14px;
  }
  .result-desc {
    font-size: calc(1.4rem * var(--font-scale));
    color: #475569;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .result-actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  /* 訂正試卷列表 */
  .review-sheet-wrap {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .bonus-callout {
    background: #fffbeb;
    border: 3px solid #f59e0b;
    border-radius: 18px;
    padding: 20px 24px;
    margin: 20px auto 26px;
    max-width: 680px;
    text-align: left;
    font-size: calc(1.25rem * var(--font-scale));
    font-weight: 800;
    color: #92400e;
    line-height: 1.6;
  }

  .retry-bar {
    background: linear-gradient(135deg, #7c2d12 0%, #c2410c 100%);
    color: #fff;
    border-radius: 18px;
    padding: 18px 24px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }

  .prev-wrong-pill {
    display: inline-block;
    background: #fee2e2;
    color: #b91c1c;
    border: 1.5px solid #fca5a5;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: calc(1.05rem * var(--font-scale));
    font-weight: 800;
    margin-left: 10px;
    vertical-align: middle;
  }

  .keyboard-hint {
    text-align: center;
    margin-top: 22px;
    color: #64748b;
    font-size: 1.15rem;
    font-weight: 700;
  }
</style>
</head>
<body>

<header>
  <div class="brand" onclick="goHome()" title="返回課次選擇首頁">
    <span class="brand-badge">潮和402 國語隨堂練</span>
    <span class="brand-title">第七課～第十二課 課堂互動與線上測驗</span>
  </div>
  <div class="toolbar">
    <button class="tool-btn" id="btn-home" onclick="goHome()" style="display:none;">🏠 回首頁</button>
    <button class="tool-btn" onclick="adjustFontSize(-0.1)" title="縮小字體">A-</button>
    <button class="tool-btn" onclick="adjustFontSize(0)" title="標準字體">標準</button>
    <button class="tool-btn" onclick="adjustFontSize(0.12)" title="放大字體">A+</button>
    <button class="tool-btn" onclick="toggleFullscreen()">⛶ 全螢幕</button>
  </div>
</header>

<main>
  <!-- 視圖 1：課次選擇首頁 -->
  <section id="view-home" class="view-panel active">
    <div class="hero-banner">
      <div>
        <h1>國語文隨堂練習與線上測驗</h1>
        <p>請點選下方課次進入「課堂投影複習」或「學生線上測驗」</p>
      </div>
    </div>

    <div class="lesson-grid" id="lesson-grid"></div>

    <div style="text-align:center;margin-top:48px;padding-top:16px;border-top:1px solid #cbd5e1;">
      <a href="teacher.html" style="color:#94a3b8;font-size:0.95rem;text-decoration:none;font-weight:700;">教師成績管理入口</a>
    </div>
  </section>

  <!-- 視圖 2：學生考試登入畫面（座號 1~29 下拉選單） -->
  <section id="view-exam-login" class="view-panel">
    <div class="login-card">
      <div class="login-header">
        <h2 id="login-lesson-title">第七課 到此「藝」遊</h2>
        <p>請確認您的班級與座號，即可開始進行線上測驗</p>
      </div>
      <form id="student-login-form" onsubmit="startStudentExam(event)">
        <div class="form-group">
          <label for="student-class">班級</label>
          <select id="student-class" class="form-control">
            <option value="4-2" selected>四年二班 (4-2)</option>
            <option value="4-1">四年一班 (4-1)</option>
            <option value="4-3">四年三班 (4-3)</option>
          </select>

    phonemes = cluster.slice(0, -1);
  }
  const charsHtml = Array.from(phonemes).map(ch => `<span>${ch}</span>`).join("");
  const lightToneHtml = (tone === "˙") ? `<span class="zhuyin-tone-light">${ZHUYIN_TONE_SVG["˙"]}</span>` : "";
  const sideToneHtml = (tone && tone !== "˙") ? `<span class="zhuyin-tone-side">${ZHUYIN_TONE_SVG[tone]}</span>` : "";
  return `<span class="zhuyin-box"><span class="zhuyin-phonemes">${lightToneHtml}${charsHtml}</span>${sideToneHtml}</span>`;
}

function formatStemHTML(text) {
  return text
    .replace(/（　）/g, '<span class="highlight-blank">　</span>')
    .replace(/【([^】]+)】/g, '<span class="highlight-quote">【$1】</span>')
    .replace(/([ㄅ-ㄩ]+[ˊˇˋ˙]?)/g, (match) => renderZhuyinCluster(match));
}

let projQIndex = 0;
let projState = {};
let isProjListMode = false;

function openProjectorMode(lessonId) {
  currentLesson = LESSONS.find(l => l.id === lessonId);
  if (!currentLesson || !currentLesson.ready) return;
  currentMode = "projector";
  projQIndex = 0;
  projState = {};

  renderProjStage();
  showView("view-projector");
}

function renderProjStage() {
  const q = currentLesson.questions[projQIndex];
  const st = projState[projQIndex] || { selected: null, revealed: false };

  document.getElementById("proj-section-badge").textContent = q.section;

  // 渲染題號導覽
  const dotsEl = document.getElementById("proj-q-dots");
  dotsEl.innerHTML = currentLesson.questions.map((item, idx) => {
    let cls = "q-dot";
    if (idx === projQIndex) cls += " current";
    const s = projState[idx];
    if (s && s.selected !== null) {
      cls += (s.selected === item.answer) ? " answered correct" : " answered wrong";
    }
    return `<button class="${cls}" onclick="jumpProjQuestion(${idx})">${idx + 1}</button>`;
  }).join("");

  document.getElementById("proj-stem").innerHTML =
    `<span class="question-num-pill">第 ${projQIndex + 1} 題</span>${formatStemHTML(q.stem)}`;

  const optsEl = document.getElementById("proj-options");
  optsEl.className = "options-grid" + (q.singleCol || q.options.some(o => o.length > 16) ? " single-col" : "");
  optsEl.innerHTML = q.options.map((optText, optIdx) => {
    let btnClass = "option-btn";
    if (st.revealed) {
      if (optIdx === q.answer) btnClass += " correct";
      else if (st.selected === optIdx) btnClass += " wrong";
    }
    return `
      <button class="${btnClass}" onclick="selectProjOption(${optIdx})">
        <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
        <span>${formatStemHTML(optText)}</span>
      </button>
    `;
  }).join("");

  const expBox = document.getElementById("proj-exp");
  if (st.revealed) {
    expBox.classList.add("show");
    document.getElementById("proj-exp-header").textContent =
      (st.selected === q.answer) ? `🎉 答對了！正確答案是 ${CIRCLED_NUMS[q.answer]}` :
      (st.selected === null) ? `💡 正確答案：${CIRCLED_NUMS[q.answer]}` :
      `❌ 答錯囉！正確答案是 ${CIRCLED_NUMS[q.answer]}`;
    document.getElementById("proj-exp-body").innerHTML = formatStemHTML(q.explanation);
  } else {
    expBox.classList.remove("show");
  }

  document.getElementById("btn-proj-prev").disabled = (projQIndex === 0);
  document.getElementById("btn-proj-next").disabled = (projQIndex === currentLesson.questions.length - 1);
}

function selectProjOption(optIdx) {

}

function revealProjAnswer() {
  const cur = projState[projQIndex] || { selected: null, revealed: false };
  projState[projQIndex] = { selected: cur.selected, revealed: !cur.revealed };
  renderProjStage();
}

function resetProjQuestion() {
  delete projState[projQIndex];

}

function prevProjQuestion() {
  if (projQIndex > 0) { projQIndex--; renderProjStage(); }
}
function nextProjQuestion() {

function jumpProjQuestion(idx) {

}

let currentStudent = { class: "4-2", seat: 1 };
let examQIndex = 0;
let examAnswers = {}; // { qIndex: optIdx (0~3) }
let currentSubmission = null; // 當次或當日測驗紀錄
let retryAnswersMap = {}; // { qIndex: optIdx (0~3) }

function getTaipeiToday() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date());
}

function getDailyStorageKey(examId, cls, seat) {
  return `exam_daily_${getTaipeiToday()}_${examId}_${cls}_${seat}`;
}

function saveDailyLocalRecord(examId, cls, seat, record) {
  try {
    localStorage.setItem(getDailyStorageKey(examId, cls, seat), JSON.stringify(record));
  } catch (e) { console.warn(e); }
}

function loadDailyLocalRecord(examId, cls, seat) {
  try {
    const raw = localStorage.getItem(getDailyStorageKey(examId, cls, seat));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function clearDailyLocalRecord(examId, cls, seat) {
  try {
    localStorage.removeItem(getDailyStorageKey(examId, cls, seat));
  } catch {}
}

async function sendRetryToSupabase(examId, cls, seat, clientId, total, retryAnswersFull, allCorrect) {
  // 1. 先嘗試呼叫已升級的 RPC submit_exam_retry
  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/submit_exam_retry`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        p_client_id: clientId,
        p_retry_answers: retryAnswersFull,
        p_retry_passed: allCorrect
      })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && (data.ok || data.reason === "already_retried_or_not_found")) {
        return true;
      }
    }
  } catch (err) {
    console.warn("submit_exam_retry RPC 失敗，改用備援寫入:", err);
  }

  // 2. 備援：若尚未執行 supabase_upgrade.sql（RPC 回 404），直接寫入 __retry 紀錄至 submissions
  try {
    const fallbackPayload = {
      exam_id: `${examId}__retry`,
      grade: 4,
      subject: "chinese",
      year: 114,
      class: cls,
      seat: seat,
      name: clientId, // 關聯原始測驗 client_id
      answers: retryAnswersFull,
      score: allCorrect ? 10 : 0,
      total: total,
      is_deleted: false,
      client_id: `${clientId}_retry`
    };
    const res2 = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/submissions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(fallbackPayload)
    });
    return res2.ok || res2.status === 409;
  } catch (err) {
    console.error("備援寫入錯題重做失敗:", err);
    return false;
  }
}

async function syncPendingLocalRetries() {
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("exam_daily_")) keys.push(k);
    }
    for (const key of keys) {
      const rec = JSON.parse(localStorage.getItem(key) || "null");
      if (!rec || rec.retry_passed === null || rec.retry_passed === undefined || rec._retry_synced) continue;
      if (!rec.client_id || !rec.retry_answers) continue;

      let examId = rec.exam_id;
      let cls = rec.class;
      let seat = rec.seat;
      if (!examId || !cls || !seat) {
        const rest = key.replace(/^exam_daily_\d{4}-\d{2}-\d{2}_/, "");
        const parts = rest.split("_");
        if (parts.length >= 3) {
          seat = parseInt(parts.pop(), 10);
          cls = parts.pop();
          examId = parts.join("_");
        }
      }
      if (!examId || !cls || !seat) continue;

      const ok = await sendRetryToSupabase(
        examId,
        cls,
        seat,
        rec.client_id,
        rec.total,
        rec.retry_answers,
        rec.retry_passed === true
      );
      if (ok) {
        rec._retry_synced = true;
        localStorage.setItem(key, JSON.stringify(rec));
      }
    }
  } catch (e) {
    console.warn("背景同步錯題重做失敗:", e);
  }
}

async function checkStudentDailyStatus(examId, cls, seat) {
  const localRec = loadDailyLocalRecord(examId, cls, seat);
  if (localRec && localRec.retry_passed !== null && localRec.retry_passed !== undefined && !localRec._retry_synced) {
    const synced = await sendRetryToSupabase(
      examId,
      cls,
      seat,
      localRec.client_id,
      localRec.total,
      localRec.retry_answers || [],
      localRec.retry_passed === true
    );
    if (synced) {
      localRec._retry_synced = true;
      saveDailyLocalRecord(examId, cls, seat, localRec);
    }
  }

  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/check_student_exam_status`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ p_exam_id: examId, p_class: cls, p_seat: seat })
    });
    if (res.ok) {
      const data = await res.json();
      if (data && data.found) {
        if (data.retry_passed === null && localRec && localRec.client_id === data.client_id && localRec.retry_passed !== null) {
          data.retry_passed = localRec.retry_passed;
          data.retry_answers = localRec.retry_answers;
          data.bonus_points = localRec.bonus_points;
          data._retry_synced = localRec._retry_synced;
        }
        saveDailyLocalRecord(examId, cls, seat, data);
        return { status: "found", record: data };
      } else {
        clearDailyLocalRecord(examId, cls, seat);
        return { status: "not_found" };
      }
    }
  } catch (err) {
    console.warn("查詢後端紀錄失敗，改用本機快取檢查:", err);
  }
  return localRec ? { status: "found", record: localRec } : { status: "not_found" };
}

  e.preventDefault();

    alert("請先選擇您的座號！");
    return;
  }
  const cls = document.getElementById("student-class").value;

  }

      alert(`您今天已經完成過本次測驗囉！（每人每日限測驗一次，不能重複作答）\n\n即將為您顯示今日的測驗成績與詳解。`);
    }

    renderExamResultView(true);

  currentSubmission = null;
  examQIndex = 0;

function prevExamQuestion() {

// 送出並檢查
async function confirmSubmitExam() {
  const total = currentLesson.questions.length;
  const missing = [];
  for (let i = 0; i < total; i++) {
    if (examAnswers[i] === undefined) missing.push(i + 1);
  }

  if (missing.length > 0) {
    const ok = confirm(`注意：您尚有第 ${missing.join("、")} 題尚未作答！\n\n確定現在就要交卷嗎？`);

    const chosen = examAnswers[i];
    if (chosen !== undefined) {
      answersArr.push(chosen + 1); // 轉為 1~4
      if (chosen === currentLesson.questions[i].answer) correctCount++;
    } else {
      answersArr.push(0); // 0 代表未作答
    }
  }

  const examId = currentLesson.examId || `${currentLesson.id}-chinese`;
  const clientId = (crypto.randomUUID ? crypto.randomUUID() : `cid-${Date.now()}-${Math.random().toString(36).slice(2)}`);

  const payload = {
    exam_id: examId,
    grade: 4,
    subject: "chinese",
    year: 114,
    class: currentStudent.class,
    seat: currentStudent.seat,
    name: null,
    answers: answersArr,
    score: correctCount,
    total: total,
    is_deleted: false,
    client_id: clientId
  };

  let duplicateBlocked = false;

  // 傳送到 Supabase
  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/submissions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok && res.status !== 409) {
      const errTxt = await res.text();
      if (errTxt.includes("already_submitted_today")) {
        duplicateBlocked = true;
      } else {
        console.warn("後端儲存狀態碼:", res.status, errTxt);
      }
    }
  } catch (err) {
    console.error("傳送至 Supabase 錯誤:", err);
  }

  submitBtn.disabled = false;
  submitBtn.textContent = "📝 檢查並交卷";

  if (duplicateBlocked) {
    alert("您今天已經交過本次測驗的考卷了！每人每日限測驗一次，將為您載入今天的測驗結果。");
    const check = await checkStudentDailyStatus(examId, currentStudent.class, currentStudent.seat);
    if (check.status === "found") {
      currentSubmission = check.record;
      examAnswers = {};
      (currentSubmission.answers || []).forEach((v, idx) => {
        if (v >= 1 && v <= 4) examAnswers[idx] = v - 1;
      });
      renderExamResultView(true);
      showView("view-exam-result");
      return;
    }
  }

  currentSubmission = {
    exam_id: examId,
    class: currentStudent.class,
    seat: currentStudent.seat,
    client_id: clientId,
    score: correctCount,
    total: total,
    answers: answersArr,
    bonus_points: 0,
    retry_passed: null,
    retry_answers: null,
    created_at: new Date().toISOString()
  };

  saveDailyLocalRecord(examId, currentStudent.class, currentStudent.seat, currentSubmission);

  // 本機備份清單
  const localBackup = JSON.parse(localStorage.getItem("chinese_quiz_submissions") || "[]");
  localBackup.push({ ...payload, created_at: currentSubmission.created_at });
  localStorage.setItem("chinese_quiz_submissions", JSON.stringify(localBackup));

  currentMode = "result";
  renderExamResultView(false);
  showView("view-exam-result");
}

function getWrongQuestionIndices() {
  if (!currentSubmission || !currentLesson) return [];
  const wrongs = [];
  currentLesson.questions.forEach((q, idx) => {
    const val = (currentSubmission.answers && currentSubmission.answers[idx]) || 0;
    if (val - 1 !== q.answer) wrongs.push(idx);
  });
  return wrongs;
}

function renderExamResultView(isReturning) {
  const total = currentSubmission.total;
  const correctCount = currentSubmission.score;
  const wrongIndices = getWrongQuestionIndices();
  const rawPct = Math.round((correctCount / total) * 100);
  const bonus = Number(currentSubmission.bonus_points || 0);
  const finalPct = Math.min(100, rawPct + bonus);
  const retryState = currentSubmission.retry_passed; // null | true | false

  const resCard = document.getElementById("res-card");
  const headerEl = document.getElementById("res-student-header");
  const scoreEl = document.getElementById("res-score-num");
  const descEl = document.getElementById("res-desc");
  const calloutEl = document.getElementById("res-bonus-callout");
  const btnRetry = document.getElementById("btn-start-retry");
  const btnCorrection = document.getElementById("btn-toggle-correction");
  const sheet = document.getElementById("correction-sheet");

  sheet.style.display = "none";

  const seatLabel = `${currentStudent.class} 班 ${currentStudent.seat} 號`;

  if (wrongIndices.length === 0) {
    // 狀態 B：原卷滿分
    resCard.style.borderColor = "#059669";
    scoreEl.style.color = "#059669";
    headerEl.textContent = `🎉 ${seatLabel} ${isReturning ? '今日測驗成績（滿分）' : '太棒了！全部答對！'}`;
    scoreEl.textContent = "100 分";
    descEl.textContent = `共 ${total} 題，全部答對！（不需進行錯題重做）`;
    calloutEl.style.display = "none";
    btnRetry.style.display = "none";
    btnCorrection.style.display = "inline-flex";
    renderCorrectionSheet();
  } else if (retryState === null || retryState === undefined) {
    // 狀態 A：有錯題且尚未重做（不揭露詳解，提供重做挑戰）
    resCard.style.borderColor = "#2563eb";
    scoreEl.style.color = "#1e40af";
    headerEl.textContent = `📝 ${seatLabel} ${isReturning ? '今日測驗紀錄（尚未完成錯題重做）' : '正式測驗已送出！'}`;
    scoreEl.textContent = `${rawPct} 分`;
    descEl.textContent = `共 ${total} 題，答對 ${correctCount} 題，答錯 ${wrongIndices.length} 題（當下分數已送至教師後台）`;

    calloutEl.style.display = "block";
    calloutEl.innerHTML = `💪 <b>錯題再戰加分機會：</b>您共有 <b>${wrongIndices.length} 題</b>答錯（第 ${wrongIndices.map(i => i + 1).join("、")} 題）。<br>現在可以針對個人錯題<b>再做一次</b>，只要全部答對就可以再加 <b>10 分</b>（最高 100 分）！若未完成重做，將以當下測驗的 ${rawPct} 分為主。`;

    btnRetry.style.display = "inline-flex";
    btnRetry.textContent = `💪 進行個人錯題重做（共 ${wrongIndices.length} 題，全對 +10 分）`;
    btnCorrection.style.display = "none"; // 未重做前隱藏解答，避免看答案照抄
  } else if (retryState === true) {
    // 狀態 C1：錯題重做全部答對 (+10)
    resCard.style.borderColor = "#059669";
    scoreEl.style.color = "#059669";
    headerEl.textContent = `🎊 ${seatLabel} 錯題重做全部答對！`;
    scoreEl.textContent = `${finalPct} 分`;
    const capNote = (rawPct + bonus > 100) ? "（滿分上限 100 分）" : "";
    descEl.textContent = `原測驗成績 ${rawPct} 分 ＋ 錯題全對加 ${bonus} 分 ＝ 最終成績 ${finalPct} 分${capNote}`;
    calloutEl.style.display = "block";
    calloutEl.style.background = "#dcfce7";
    calloutEl.style.borderColor = "#16a34a";
    calloutEl.style.color = "#14532d";
    calloutEl.innerHTML = `✅ 已成功獲得 <b>+10 分</b>訂正加分，最終成績已更新傳送至教師後台！`;

    btnRetry.style.display = "none";
    btnCorrection.style.display = "inline-flex";
    renderCorrectionSheet();
  } else {
    // 狀態 C2：錯題重做未全對 (+0)
    resCard.style.borderColor = "#d97706";
    scoreEl.style.color = "#b45309";
    headerEl.textContent = `📋 ${seatLabel} 已完成測驗與錯題訂正`;
    scoreEl.textContent = `${rawPct} 分`;
    descEl.textContent = `共 ${total} 題，原答對 ${correctCount} 題（錯題重做未全部答對，維持原測驗分數 ${rawPct} 分）`;
    calloutEl.style.display = "block";
    calloutEl.style.background = "#fffbeb";
    calloutEl.style.borderColor = "#f59e0b";
    calloutEl.style.color = "#92400e";
    calloutEl.innerHTML = `💡 錯題重做僅限一次機會，這次未能全對非常可惜，請點下方「查看完整試卷訂正與詳解」弄懂每一題喔！`;

    btnRetry.style.display = "none";
    btnCorrection.style.display = "inline-flex";
    renderCorrectionSheet();
  }
}

// ==================== 個人錯題重做流程 ====================
function startWrongQuestionRetry() {
  const wrongIndices = getWrongQuestionIndices();
  if (wrongIndices.length === 0) return;

  retryAnswersMap = {};
  currentMode = "retry";

  const num = currentStudent.seat < 10 ? `0${currentStudent.seat}` : `${currentStudent.seat}`;
  document.getElementById("retry-badge-info").textContent = `${currentStudent.class} 班 ${num} 號`;
  document.getElementById("retry-lesson-title").textContent =
    `${currentLesson.lessonNum}《${currentLesson.title}》個人錯題重做（全部答對加 10 分）`;

  renderRetryList();
  showView("view-exam-retry");
}

function renderRetryList() {
  const wrongIndices = getWrongQuestionIndices();
  const answeredCnt = Object.keys(retryAnswersMap).length;
  document.getElementById("retry-progress-text").textContent =
    `已重寫 ${answeredCnt} / ${wrongIndices.length} 題`;

  const container = document.getElementById("retry-questions-list");
  container.innerHTML = wrongIndices.map(qIdx => {
    const q = currentLesson.questions[qIdx];
    const prevChoice = (currentSubmission.answers && currentSubmission.answers[qIdx]) ? currentSubmission.answers[qIdx] - 1 : undefined;
    const retryChoice = retryAnswersMap[qIdx];
    const singleCol = q.singleCol || q.options.some(o => o.length > 16);

    const optsHtml = q.options.map((optText, optIdx) => {
      const isSel = (retryChoice === optIdx);
      return `
        <button class="option-btn ${isSel ? 'selected-student' : ''}" onclick="selectRetryOption(${qIdx}, ${optIdx})">
          <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
          <span>${formatStemHTML(optText)}</span>
        </button>
      `;
    }).join("");

    return `
      <div class="stage-card">
        <div class="question-stem">
          <div style="margin-bottom:12px;">
            <span class="question-num-pill">第 ${qIdx + 1} 題</span>
            <span class="prev-wrong-pill">上次誤選：${prevChoice !== undefined ? CIRCLED_NUMS[prevChoice] : '未作答'}</span>
          </div>
          ${formatStemHTML(q.stem)}
        </div>
        <div class="options-grid ${singleCol ? 'single-col' : ''}">${optsHtml}</div>
      </div>
    `;
  }).join("");
}

function selectRetryOption(qIdx, optIdx) {
  retryAnswersMap[qIdx] = optIdx;
  renderRetryList();
}

function cancelRetryBackToResult() {
  currentMode = "result";
  renderExamResultView(true);
  showView("view-exam-result");
}

async function submitWrongQuestionRetry() {
  const wrongIndices = getWrongQuestionIndices();
  const missing = wrongIndices.filter(qIdx => retryAnswersMap[qIdx] === undefined);

  if (missing.length > 0) {
    alert(`您還有第 ${missing.map(i => i + 1).join("、")} 題尚未重寫喔！請全部作答完成再送出。`);
    return;
  }

  if (!confirm("確定要送出錯題重做嗎？送出後將立即批改並計算最終成績（限重做一次）。")) return;

  const btn = document.getElementById("btn-submit-retry");
  btn.disabled = true;
  btn.textContent = "⏳ 批改並更新成績中...";

  const total = currentSubmission.total;
  const retryAnswersFull = new Array(total).fill(0);
  let allCorrect = true;

  wrongIndices.forEach(qIdx => {
    const chosen = retryAnswersMap[qIdx];
    retryAnswersFull[qIdx] = chosen + 1;
    if (chosen !== currentLesson.questions[qIdx].answer) {
      allCorrect = false;
    }
  });

  const examId = currentLesson.examId || `${currentLesson.id}-chinese`;

  // 呼叫後端儲存錯題重做結果（自動支援 RPC 與 __retry 備援寫入）
  const synced = await sendRetryToSupabase(
    examId,
    currentStudent.class,
    currentStudent.seat,
    currentSubmission.client_id,
    total,
    retryAnswersFull,
    allCorrect
  );

  btn.disabled = false;
  btn.textContent = "✅ 送出錯題重做（限一次機會）";

  currentSubmission.exam_id = examId;
  currentSubmission.class = currentStudent.class;
  currentSubmission.seat = currentStudent.seat;
  currentSubmission.retry_answers = retryAnswersFull;
  currentSubmission.retry_passed = allCorrect;
  currentSubmission.bonus_points = allCorrect ? 10 : 0;
  currentSubmission._retry_synced = synced;

  saveDailyLocalRecord(examId, currentStudent.class, currentStudent.seat, currentSubmission);

  if (!synced) {
    alert("注意：目前網路連線似乎不穩，您的錯題重做結果已先暫存在這台裝置，待網路恢復並重新開啟網頁時會自動傳送給老師！");
  }

  currentMode = "result";
  renderExamResultView(false);
  showView("view-exam-result");
}

// 產生學生個人訂正詳解清單（含重做紀錄）
function renderCorrectionSheet() {
  const container = document.getElementById("correction-sheet");
  let html = `<h2 style="font-size:2rem;font-weight:900;color:#1e3a8a;margin-bottom:12px;">📑 試卷題目訂正與詳解</h2>`;

  currentLesson.questions.forEach((q, idx) => {
    const rawAnsVal = (currentSubmission && currentSubmission.answers) ? currentSubmission.answers[idx] : 0;
    const studentChoice = rawAnsVal >= 1 ? rawAnsVal - 1 : undefined;
    const retryVal = (currentSubmission && currentSubmission.retry_answers) ? currentSubmission.retry_answers[idx] : 0;
    const retryChoice = retryVal >= 1 ? retryVal - 1 : undefined;

    const isOrigCorrect = (studentChoice === q.answer);
    const isRetryCorrect = (retryChoice === q.answer);
    const singleCol = q.singleCol || q.options.some(o => o.length > 16);

    const optsHtml = q.options.map((optText, optIdx) => {
      let cls = "option-btn";
      if (optIdx === q.answer) cls += " correct";
      else if (retryChoice === optIdx || (retryChoice === undefined && studentChoice === optIdx)) cls += " wrong";
      return `
        <div class="${cls}">
          <span class="opt-index">${CIRCLED_NUMS[optIdx]}</span>
          <span>${formatStemHTML(optText)}</span>
        </div>
      `;
    }).join("");

    let statusTag = "";
    if (isOrigCorrect) {
      statusTag = `<span style="background:#dcfce7;color:#16a34a;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">✅ 初次作答答對</span>`;
    } else if (retryChoice !== undefined) {
      const origTxt = studentChoice !== undefined ? CIRCLED_NUMS[studentChoice] : "未答";
      if (isRetryCorrect) {
        statusTag = `<span style="background:#dbeafe;color:#1d4ed8;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">💪 錯題重做答對（原選 ${origTxt} → 改選 ${CIRCLED_NUMS[retryChoice]}）</span>`;
      } else {
        statusTag = `<span style="background:#fee2e2;color:#dc2626;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">❌ 重做仍誤（原選 ${origTxt} → 重做選 ${CIRCLED_NUMS[retryChoice]}）</span>`;
      }
    } else {
      statusTag = (studentChoice === undefined)
        ? `<span style="background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">未作答</span>`
        : `<span style="background:#fee2e2;color:#dc2626;padding:4px 12px;border-radius:8px;font-weight:800;font-size:1.1rem;">❌ 答錯（您的答案：${CIRCLED_NUMS[studentChoice]}）</span>`;
    }

    html += `
      <div class="stage-card">
        <div class="question-stem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
            <span class="question-num-pill">第 ${idx + 1} 題</span>
            ${statusTag}
          </div>
          ${formatStemHTML(q.stem)}
        </div>
        <div class="options-grid ${singleCol ? 'single-col' : ''}">${optsHtml}</div>
        <div class="explanation-box show" style="margin-top:20px;">
          <div class="exp-header">💡 正確解答：${CIRCLED_NUMS[q.answer]}</div>
          <div class="exp-body">${formatStemHTML(q.explanation)}</div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function showCorrectionSheet() {
  const sheet = document.getElementById("correction-sheet");
  sheet.style.display = (sheet.style.display === "none") ? "flex" : "none";
  if (sheet.style.display === "flex") {
    sheet.scrollIntoView({ behavior: "smooth" });
  }
}

// ==================== 字級與全螢幕輔助 ====================
function adjustFontSize(delta) {
  if (delta === 0) {
    fontScale = 1;
  } else {
    fontScale = Math.min(1.45, Math.max(0.8, +(fontScale + delta).toFixed(2)));
  }
  document.documentElement.style.setProperty("--font-scale", fontScale);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
}

// 課堂鍵盤快捷鍵
window.addEventListener("keydown", (e) => {
  if (currentMode === "projector" && !isProjListMode) {
    if (e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault(); nextProjQuestion();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault(); prevProjQuestion();
    } else if (["1", "2", "3", "4"].includes(e.key)) {
      e.preventDefault(); selectProjOption(parseInt(e.key, 10) - 1);
    } else if (e.key === " ") {
      e.preventDefault(); revealProjAnswer();
    }
  } else if (currentMode === "exam") {
    if (["1", "2", "3", "4"].includes(e.key)) {
      selectExamOption(parseInt(e.key, 10) - 1);
    } else if (e.key === "ArrowRight") {
      nextExamQuestion();
    } else if (e.key === "ArrowLeft") {
      prevExamQuestion();
    }
  }
});

// 初始化
initSeatSelect();
renderHome();
syncPendingLocalRetries();
</script>

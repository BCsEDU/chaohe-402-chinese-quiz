<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>教師後台 - 國語隨堂測驗成效管理系統</title>
<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --primary: #1e40af;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #cbd5e1;
    --correct: #16a34a;
    --wrong: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding-bottom: 60px;
  }

  header {
    background: #1e3a8a;
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .badge { background: #fbbf24; color: #1e3a8a; font-weight: 900; padding: 4px 12px; border-radius: 999px; font-size: 1.15rem; }
  .title { font-size: 1.5rem; font-weight: 900; }
  .nav-link { color: #dbeafe; font-weight: 800; text-decoration: none; font-size: 1.1rem; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); }
  .nav-link:hover { background: rgba(255,255,255,0.15); color: #fff; }

  main { max-width: 1440px; margin: 24px auto; padding: 0 20px; }

  /* 登入卡片 */
  .login-box {
    max-width: 480px;
    margin: 60px auto;
    background: #fff;
    border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
    border: 2px solid #cbd5e1;
    text-align: center;
  }
  .login-box h2 { font-size: 2rem; color: #1e3a8a; margin-bottom: 8px; font-weight: 900; }
  .login-box p { color: var(--text-muted); font-size: 1.1rem; margin-bottom: 24px; }
  .input-pw {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    border: 2px solid #cbd5e1;
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 20px;
    text-align: center;
    outline: none;
  }
  .input-pw:focus { border-color: #2563eb; }
  .btn-login {
    width: 100%;
    padding: 16px;
    border-radius: 14px;
    background: #1e40af;
    color: #fff;
    font-size: 1.3rem;
    font-weight: 900;
    border: none;
    cursor: pointer;
    transition: background 0.15s;

  .btn-login:hover { background: #1d4ed8; }
  .err-msg { color: #dc2626; font-size: 1.1rem; font-weight: 800; margin-top: 14px; min-height: 24px; }

  /* 後台控制面板 */
  .panel {
    background: #fff;
    border-radius: 20px;
    padding: 24px 28px;
    border: 2px solid #cbd5e1;
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.05);
    margin-bottom: 24px;
  }

  .filters-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .filter-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .filter-select {
    padding: 10px 16px;
    border-radius: 10px;
    border: 2px solid #cbd5e1;
    font-size: 1.15rem;
    font-weight: 800;
    background: #f8fafc;
    color: #0f172a;
    outline: none;
  }

  .action-btn {
    padding: 10px 18px;
    border-radius: 10px;
    border: 2px solid #cbd5e1;
    font-size: 1.1rem;
    font-weight: 800;
    cursor: pointer;
    background: #fff;
    color: #0f172a;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;

  .action-btn:hover { background: #eff6ff; border-color: #2563eb; }
  .action-btn.export { background: #059669; color: #fff; border-color: #047857; }
  .action-btn.export:hover { background: #047857; }
  .action-btn.sync-grades { background: #2563eb; color: #fff; border-color: #1d4ed8; }
  .action-btn.sync-grades:hover { background: #1d4ed8; }
  .action-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .grades-link {
    text-decoration: none;

    color: #1d4ed8;
    border-color: #93c5fd;
  }

  /* 統計方塊 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-top: 18px;
  }
  .stat-card {
    background: #f8fafc;
    border-radius: 14px;
    border: 2px solid #e2e8f0;
    padding: 18px 20px;
    text-align: center;
  }
  .stat-val { font-size: 2.8rem; font-weight: 900; color: #1e40af; line-height: 1.1; margin-bottom: 4px; }
  .stat-lbl { font-size: 1.1rem; color: #64748b; font-weight: 800; }

  /* 1~29 座號即時盤點看板 */
  .section-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #1e3a8a;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .seats-board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 12px;
  }
  .seat-box {
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
    border: 2.5px solid #cbd5e1;
    background: #f8fafc;
    transition: all 0.15s;
  }
  .seat-box.submitted {
    background: #dcfce7;
    border-color: #16a34a;
    color: #14532d;
  }
  .seat-box.unsubmitted {
    background: #f1f5f9;

    color: #64748b;

  }
  .seat-num { font-size: 1.45rem; font-weight: 900; }
  .seat-score { font-size: 1.25rem; font-weight: 900; margin-top: 2px; }
  .seat-name { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 表格樣式 */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 1.15rem;
  }
  .data-table th, .data-table td {
    padding: 14px 16px;
    text-align: left;
    border-bottom: 1.5px solid #e2e8f0;
  }
  .data-table th {
    background: #f8fafc;
    color: #334155;

  }
  .data-table tr:hover td { background: #f8fafc; }

  /* 答對率長條圖 */
  .bar-container {
    width: 100%;
    height: 18px;
    background: #e2e8f0;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-inner {
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s;
  }
  .bar-high { background: #16a34a; }
  .bar-mid { background: #eab308; }
  .bar-low { background: #dc2626; }

  .badge-del {
    background: #fee2e2;
    color: #dc2626;
    border: 1px solid #f87171;
    padding: 4px 10px;
    border-radius: 8px;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .badge-del:hover { background: #dc2626; color: #fff; }

  .pill-status {
    display: inline-block;
    padding: 4px 10px;

  .pill-retry-ok { background: #dbeafe; color: #1d4ed8; }
  .pill-retry-fail { background: #fee2e2; color: #b91c1c; }
  .pill-retry-wait { background: #fef3c7; color: #92400e; }
</style>

<script>
const SUPABASE_CONFIG = {
  URL: "https://ppdgubracsneozahujxl.supabase.co",
  ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBwZGd1YnJhY3NuZW96YWh1anhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzMDY2ODAsImV4cCI6MjEwOTg4MjY4MH0.sqLIf_xBLNyJ4zG0twoBfnMkYA8-UE0DvyG-3gXn-RE"
};

// 試卷題解對照表（供後台計算各題答對率）
const EXAM_KEYS = {
  "L7-chinese": {
    name: "第七課《到此「藝」遊》",
    total: 15,
    // 1-indexed 正確答案：1, 3, 1, 1, 1, 3, 4, 4, 2, 3, 1, 2, 3, 4, 3
    answers: [1, 3, 1, 1, 1, 3, 4, 4, 2, 3, 1, 2, 3, 4, 3]
  },
  "L8-chinese": {
    name: "第八課《四季的頭髮》",
    total: 20,
    // 1-indexed 正確答案：第1~20題
    answers: [2, 1, 3, 2, 3, 4, 4, 1, 3, 2, 4, 3, 1, 2, 1, 2, 4, 3, 2, 3]
  },
  "L9-chinese": {
    name: "第九課《阿白觀察記》",
    total: 12,
    // 1-indexed 正確答案：第1~12題
    answers: [1, 3, 2, 4, 3, 1, 2, 4, 3, 1, 4, 2]
  }
};

let currentPw = "";
let allSubmissions = [];
let autoRefreshTimer = null;

async function handleLogin(e) {
  e.preventDefault();
  const pw = document.getElementById("input-pw").value;
  const btn = document.getElementById("btn-login-submit");
  const errEl = document.getElementById("login-err");
  errEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "驗證中...";

  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/teacher_get_submissions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ pw })
    });

    if (!res.ok) {
      throw new Error("密碼錯誤或連線失敗，請重新輸入！");
    }

    const data = await res.json();
    currentPw = pw;
    allSubmissions = mergeRetryRows(data);

    document.getElementById("sec-login").style.display = "none";
    document.getElementById("sec-dashboard").style.display = "block";
    document.getElementById("btn-logout").style.display = "inline-flex";

    syncDynamicExamOptions();
    renderDashboard();
    startAutoRefresh();
  } catch (err) {
    errEl.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "登入管理後台";
  }
}

function logout() {
  currentPw = "";
  allSubmissions = [];
  clearInterval(autoRefreshTimer);
  document.getElementById("input-pw").value = "";
  document.getElementById("sec-login").style.display = "block";
  document.getElementById("sec-dashboard").style.display = "none";
  document.getElementById("btn-logout").style.display = "none";
}

async function fetchData() {
  if (!currentPw) return;
  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/teacher_get_submissions`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ pw: currentPw })
    });
    if (res.ok) {
      allSubmissions = mergeRetryRows(await res.json());
      syncDynamicExamOptions();
      renderDashboard();
      document.getElementById("txt-last-update").textContent =
        `最後更新：${new Date().toLocaleTimeString("zh-TW", { hour12: false })}`;
    }
  } catch (err) {
    console.error("更新失敗:", err);
  }
}

function startAutoRefresh() {
  clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(() => {
    if (document.getElementById("chk-auto-refresh").checked && !document.hidden) {
      fetchData();
    }
  }, 5000);
}

function getTaipeiDay(isoStr) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei" }).format(new Date(isoStr));
}

function mergeRetryRows(rawRows) {
  const mainRows = [];
  const retryRows = [];
  rawRows.forEach(r => {
    if (r.exam_id && r.exam_id.endsWith("__retry")) {
      retryRows.push(r);
    } else {
      mainRows.push({ ...r });
    }
  });

  const byClientId = {};
  mainRows.forEach(m => {
    if (m.client_id) byClientId[m.client_id] = m;
  });

  retryRows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  retryRows.forEach(rr => {
    const baseExamId = rr.exam_id.replace(/__retry$/, "");
    const rrDay = getTaipeiDay(rr.created_at);
    let target = (rr.name && byClientId[rr.name]) ? byClientId[rr.name] : null;
    if (!target) {
      target = mainRows.find(m =>
        m.exam_id === baseExamId &&
        m.class === rr.class &&
        m.seat === rr.seat &&
        getTaipeiDay(m.created_at) === rrDay
      );
    }
    if (target && target.score < target.total && (target.retry_passed === null || target.retry_passed === undefined)) {
      target._retry_id = rr.id;
      target.bonus_points = Number(rr.score || 0);
      target.retry_passed = (Number(rr.score || 0) === 10);
      target.retry_answers = rr.answers;
      target.retry_at = rr.created_at;
    }
  });

  return mainRows;
}

// 刪除單筆作答（若有關聯的 __retry 紀錄一併刪除）
async function deleteRow(id) {
  if (!confirm("確定要刪除這筆學生的作答紀錄嗎？")) return;
  const rec = allSubmissions.find(x => x.id === id);
  try {
    const res = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/teacher_delete_submission`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ pw: currentPw, sid: id })
    });
    if (res.ok) {
      if (rec && rec._retry_id) {
        await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/teacher_delete_submission`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_CONFIG.ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ pw: currentPw, sid: rec._retry_id })
        }).catch(() => {});
      }
      allSubmissions = allSubmissions.filter(x => x.id !== id);
      renderDashboard();
    } else {
      alert("刪除失敗！");
    }
  } catch (err) {
    alert("刪除失敗：" + err.message);
  }
}

// 計算學生原始成績、錯題重做加分、最終成績
function computeScoreInfo(r) {
  const rawPct = r.total ? Math.round((r.score / r.total) * 100) : 0;
  const bonus = Number(r.bonus_points || 0);
  const finalPct = Math.min(100, rawPct + bonus);

  let statusText = "";
  let statusClass = "";
  let shortTag = "";

  if (r.score >= r.total) {
    statusText = "💯 原卷滿分";
    statusClass = "pill-perfect";
    shortTag = "原卷滿分";
  } else if (r.retry_passed === true) {
    statusText = "✅ 錯題全對 +10";
    statusClass = "pill-retry-ok";
    shortTag = `原${rawPct} +10`;
  } else if (r.retry_passed === false) {
    statusText = "❌ 重做未全對 (+0)";
    statusClass = "pill-retry-fail";
    shortTag = `原${rawPct} 未通過`;
  } else {
    statusText = "⏳ 尚未重做";
    statusClass = "pill-retry-wait";
    shortTag = "尚未重做";
  }

  return { rawPct, bonus, finalPct, statusText, statusClass, shortTag };
}

// 渲染儀表板
function renderDashboard() {
  const selectedExam = document.getElementById("sel-exam").value;
  const selectedClass = document.getElementById("sel-class").value;

  // 篩選資料
  const filtered = allSubmissions.filter(r => {
    if (selectedExam && r.exam_id !== selectedExam) return false;
    if (selectedClass && r.class !== selectedClass) return false;
    return true;
  });

  // 1. 統計方塊
  const totalCount = filtered.length;
  const uniqueStudents = new Set(filtered.map(r => `${r.class}-${r.seat}`)).size;
  const scoreInfos = filtered.map(computeScoreInfo);
  const rawScores = scoreInfos.map(s => s.rawPct);
  const finalScores = scoreInfos.map(s => s.finalPct);

  const avgRaw = rawScores.length ? Math.round(rawScores.reduce((a, b) => a + b, 0) / rawScores.length) : 0;
  const avgFinal = finalScores.length ? Math.round(finalScores.reduce((a, b) => a + b, 0) / finalScores.length) : 0;
  const maxScore = finalScores.length ? Math.max(...finalScores) : 0;
  const minScore = finalScores.length ? Math.min(...finalScores) : 0;
  const bonusCount = filtered.filter(r => r.retry_passed === true).length;

  document.getElementById("stats-summary").innerHTML = `
    <div class="stat-card">
      <div class="stat-val">${totalCount}</div>
      <div class="stat-lbl">繳卷總人次</div>
    </div>
    <div class="stat-card">
      <div class="stat-val">${uniqueStudents}</div>
      <div class="stat-lbl">實際應考學生數</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#15803d;">${avgFinal}<span style="font-size:1.6rem;">分</span></div>
      <div class="stat-lbl">平均最終成績（原平均 ${avgRaw}分）</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#2563eb;">${maxScore}<span style="font-size:1.6rem;">分</span></div>
      <div class="stat-lbl">最高最終成績</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#d97706;">${minScore}<span style="font-size:1.6rem;">分</span></div>
      <div class="stat-lbl">最低最終成績</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" style="color:#0284c7;">${bonusCount}</div>
      <div class="stat-lbl">錯題全對加分人數</div>
    </div>
  `;

  // 2. 1~29 號點名看板（以最新一筆作答為準）
  const seatMap = {};
  filtered.forEach(r => {
    if (!seatMap[r.seat] || new Date(r.created_at) > new Date(seatMap[r.seat].created_at)) {
      seatMap[r.seat] = r;
    }
  });

  let submittedCount = 0;
  let seatsHtml = "";
  for (let seat = 1; seat <= 29; seat++) {
    const rec = seatMap[seat];
    const seatPad = seat < 10 ? `0${seat}` : `${seat}`;
    if (rec) {
      submittedCount++;
      const info = computeScoreInfo(rec);
      seatsHtml += `
        <div class="seat-box submitted">
          <div class="seat-num">${seatPad} 號 ✅</div>
          <div class="seat-score">${info.finalPct} 分</div>
          <div class="seat-name" style="color:${info.bonus > 0 ? '#1d4ed8' : '#15803d'};">${info.shortTag}</div>
        </div>
      `;
    } else {
      seatsHtml += `
        <div class="seat-box unsubmitted">
          <div class="seat-num">${seatPad} 號</div>
          <div class="seat-score" style="color:#94a3b8;">未繳交</div>
          <div class="seat-name">—</div>
        </div>
      `;
    }
  }
  document.getElementById("seats-board").innerHTML = seatsHtml;
  document.getElementById("seat-status-text").textContent = `已繳交：${submittedCount} / 29 人（繳交率 ${Math.round((submittedCount/29)*100)}%）`;

  // 3. 各題答對率分析
  const examInfo = EXAM_KEYS[selectedExam];
  const tbodyItem = document.getElementById("tbody-item-analysis");

  if (!examInfo) {
    tbodyItem.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#64748b;padding:24px;">請於上方選單指定單一試卷，以查看該卷各題答對率分析</td></tr>`;
  } else if (filtered.length === 0) {
    tbodyItem.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#64748b;padding:24px;">目前尚無作答數據</td></tr>`;
  } else {
    const itemStats = examInfo.answers.map((key, i) => {
      const dist = [0, 0, 0, 0, 0]; // [未答, ①, ②, ③, ④]
      filtered.forEach(r => {
        const studentAns = (r.answers && r.answers[i] !== undefined) ? r.answers[i] : 0;
        dist[studentAns]++;
      });
      const correctCount = dist[key];
      const rate = Math.round((correctCount / filtered.length) * 100);
      const wrongCount = filtered.length - correctCount;
      return { qNum: i + 1, key, rate, wrongCount, dist };
    });

    // 依答對率由低到高排列
    itemStats.sort((a, b) => a.rate - b.rate);

    tbodyItem.innerHTML = itemStats.map(item => {
      const barClass = (item.rate >= 75) ? "bar-high" : (item.rate >= 50) ? "bar-mid" : "bar-low";
      const circKey = ["①", "②", "③", "④"][item.key - 1] || item.key;
      return `
        <tr>
          <td><b style="font-size:1.25rem;color:#1e3a8a;">第 ${item.qNum} 題</b></td>
          <td><b style="font-size:1.25rem;color:#15803d;">${circKey}</b></td>
          <td><b style="font-size:1.2rem;">${item.rate}%</b></td>
          <td>
            <div class="bar-container">
              <div class="bar-inner ${barClass}" style="width:${item.rate}%;"></div>
            </div>
          </td>
          <td><b style="color:${item.wrongCount > 0 ? '#dc2626' : '#64748b'};">${item.wrongCount} 人</b></td>
          <td style="color:#475569;">
            ${item.dist[1]} / ${item.dist[2]} / ${item.dist[3]} / ${item.dist[4]} ／ 未答 ${item.dist[0]}
          </td>
        </tr>
      `;
    }).join("");
  }

  // 4. 學生詳細作答清單
  document.getElementById("table-count-label").textContent = `共 ${filtered.length} 筆紀錄`;
  const tbodyStudent = document.getElementById("tbody-student-records");
  if (filtered.length === 0) {
    tbodyStudent.innerHTML = `<tr><td colspan="9" style="text-align:center;color:#64748b;padding:24px;">目前無符合條件的學生作答資料</td></tr>`;
  } else {
    tbodyStudent.innerHTML = filtered.map(r => {
      const eInfo = EXAM_KEYS[r.exam_id];
      const info = computeScoreInfo(r);

      // 計算原始錯題題號
      let wrongQs = [];
      if (eInfo && r.answers) {
        eInfo.answers.forEach((ansKey, idx) => {
          if (r.answers[idx] !== ansKey) wrongQs.push(idx + 1);
        });
      }

      const dateStr = new Date(r.created_at).toLocaleString("zh-TW", { hour12: false });
      return `
        <tr>
          <td style="color:#64748b;font-size:1rem;">${dateStr}</td>
          <td><b>${eInfo ? eInfo.name : r.exam_id}</b></td>
          <td>${r.class}</td>
          <td><b>${r.seat} 號</b></td>
          <td>${info.rawPct} 分 <span style="color:#64748b;font-size:0.95rem;">(${r.score}/${r.total})</span></td>
          <td><span class="pill-status ${info.statusClass}">${info.statusText}</span></td>
          <td><b style="color:${info.finalPct >= 80 ? '#15803d' : info.finalPct >= 60 ? '#d97706' : '#dc2626'};font-size:1.25rem;">${info.finalPct} 分</b></td>
          <td><span style="color:#dc2626;font-weight:800;">${wrongQs.length ? wrongQs.map(n => `第${n}題`).join('、') : '全對 💯'}</span></td>
          <td>
            <button class="badge-del" onclick="deleteRow(${r.id})">刪除</button>
          </td>
        </tr>
      `;
    }).join("");
  }
}

function getFilteredSubmissions() {
  const selectedExam = document.getElementById("sel-exam").value;
  const selectedClass = document.getElementById("sel-class").value;
  return allSubmissions.filter(r => {
    if (selectedExam && r.exam_id !== selectedExam) return false;
    if (selectedClass && r.class !== selectedClass) return false;
    return true;
  });
}

function formatTaiwanDate(dateInput) {
  const ts = dateInput ? new Date(dateInput).getTime() : Date.now();
  return new Date(ts + 8 * 3600000).toISOString().slice(0, 10);
}

function escapeCsvCell(val) {
  if (val === null || val === undefined) return "";
  const str = String(val);
  if (/[",\r\n\t]/.test(str)) {
    return `"${str.replace(/"/g, '""')}"`;
  }
  return str;
}

function downloadCsvRows(rows, filename) {
  const csvContent = "\ufeff" + rows.map(row => row.map(escapeCsvCell).join(",")).join("\r\n");
  const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// 匯出相容於「成績管理系統 (chaohe-402-grades)」的明細 CSV
function exportCSV() {
  const filtered = getFilteredSubmissions();
  if (filtered.length === 0) {
    alert("目前沒有資料可匯出！");
    return;
  }

  // 每份試卷每位學生只取最新一筆作答（與點名看板一致）
  const latestMap = new Map();
  const examLatestDate = {};
  filtered.forEach(r => {
    const key = `${r.exam_id}|${r.class}|${r.seat}`;
    const prev = latestMap.get(key);
    if (!prev || new Date(r.created_at) > new Date(prev.created_at)) {
      latestMap.set(key, r);
    }
    const localDate = formatTaiwanDate(r.created_at);
    if (!examLatestDate[r.exam_id] || localDate > examLatestDate[r.exam_id]) {
      examLatestDate[r.exam_id] = localDate;
    }
  });

  const examOrder = Object.keys(EXAM_KEYS);
  const records = Array.from(latestMap.values()).sort((a, b) => {
    const ea = examOrder.indexOf(a.exam_id);
    const eb = examOrder.indexOf(b.exam_id);
    if (ea !== eb) {
      if (ea === -1) return 1;
      if (eb === -1) return -1;
      return ea - eb;
    }
    if (a.exam_id !== b.exam_id) return String(a.exam_id).localeCompare(String(b.exam_id));
    return Number(a.seat) - Number(b.seat);
  });

  const rows = [
    ["座號", "科目", "成績類別", "評量名稱", "日期", "滿分", "分數"]
  ];

  records.forEach(r => {
    const eInfo = EXAM_KEYS[r.exam_id];
    const info = computeScoreInfo(r);
    const title = eInfo ? eInfo.name : r.exam_id;

    rows.push([
      r.seat,
      "國語",
      "小考",
      title,
      examLatestDate[r.exam_id] || formatTaiwanDate(r.created_at),
      100,
      info.finalPct
    ]);
  });

  const selectedExam = document.getElementById("sel-exam").value;
  const examLabel = selectedExam && EXAM_KEYS[selectedExam]
    ? EXAM_KEYS[selectedExam].name.replace(/[\\/:*?"<>|]/g, "")
    : "國語小考";
  downloadCsvRows(rows, `402成績管理匯入_${examLabel}_${formatTaiwanDate()}.csv`);
}

function getChineseExamDisplayName(examId) {
  if (EXAM_KEYS[examId]?.name) return EXAM_KEYS[examId].name;
  const matched = allSubmissions.find(r => r.exam_id === examId && r.exam_title);
  if (matched?.exam_title) return matched.exam_title;
  return examId;
}

function syncDynamicExamOptions() {
  const sel = document.getElementById("sel-exam");
  if (!sel) return;
  const existingValues = new Set(Array.from(sel.options).map(o => o.value));
  const extraIds = Array.from(new Set(
    allSubmissions
      .map(r => r.exam_id)
      .filter(id => id && /^L\d+-chinese$/i.test(id) && !existingValues.has(id))
  )).sort();
  if (!extraIds.length) return;
  const allOpt = Array.from(sel.options).find(o => o.value === "");
  extraIds.forEach(id => {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = `${getChineseExamDisplayName(id)} 隨堂測驗`;
    if (allOpt) sel.insertBefore(opt, allOpt);
    else sel.appendChild(opt);
  });
}

function isClass402(cls) {
  return String(cls || "").replace(/[^0-9]/g, "") === "402";
}

function buildAutoSyncNote(r, info) {
  if (r.score >= r.total && r.total > 0) return "[線上測驗] 原卷滿分";
  if (info.bonus > 0) return `[線上測驗] 原${info.rawPct}分 +${info.bonus}訂正`;
  if (r.retry_passed === false) return `[線上測驗] 原${info.rawPct}分（已訂正未全對）`;
  return `[線上測驗] 原${info.rawPct}分（待訂正）`;
}

// 同步至「402 成績管理系統 (chaohe-402-grades)」：優先走 DB RPC，尚未執行 migration 時自動改走 grade-sync Edge Function
async function syncToGradeManager() {
  if (!currentPw) {
    alert("請先登入教師管理後台！");
    return;
  }

  const selectedExam = document.getElementById("sel-exam").value;
  const examTitle = selectedExam ? getChineseExamDisplayName(selectedExam) : null;
  const targetLabel = selectedExam ? `「${examTitle}」` : "「全部國語線上測驗」";

  const btn = document.getElementById("btn-sync-grades");
  const prevText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "⏳ 同步中...";

  try {
    // 1. 優先呼叫伺服器端 RPC（若已安裝自動同步 SQL）
    const rpcRes = await fetch(`${SUPABASE_CONFIG.URL}/rest/v1/rpc/teacher_sync_exam_to_grades`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        pw: currentPw,
        p_exam_id: selectedExam || null,
        p_exam_title: examTitle || null,
        p_subject: "chinese"
      })
    });

    if (rpcRes.ok) {
      const data = await rpcRes.json();
      const assessSummary = (data.assessments || [])
        .map(a => `・國語｜${a.title}${a.locked ? "（🔒 已鎖定略過）" : ""}`)
        .join("\n");
      alert(
        `✅ 已同步 ${targetLabel} 至 402 成績管理系統！\n\n` +
        `・成功寫入／更新：${data.synced_count ?? 0} 位學生\n` +
        (data.locked_count ? `・因欄位已鎖定略過：${data.locked_count} 位\n` : "") +
        (assessSummary ? `\n對應評量欄位：\n${assessSummary}` : "")
      );
      return;
    }

    if (rpcRes.status !== 404) {
      const errTxt = await rpcRes.text();
      throw new Error(`同步 RPC 失敗 (${rpcRes.status})：${errTxt}`);
    }

    // 2. 備援：尚未套用 DB Trigger SQL 時，直接呼叫已部署的 grade-sync Edge Function
    const sourceRows = allSubmissions.filter(r => {
      if (!isClass402(r.class)) return false;
      if (selectedExam) return r.exam_id === selectedExam;
      return /^L\d+-chinese$/i.test(String(r.exam_id || ""));
    });

    if (sourceRows.length === 0) {
      alert(`目前沒有 402 班的 ${targetLabel} 作答紀錄可同步。`);
      return;
    }

    const latestMap = new Map();
    const examLatestDate = {};
    sourceRows.forEach(r => {
      const key = `${r.exam_id}|${r.seat}`;
      const prev = latestMap.get(key);
      if (!prev || new Date(r.created_at) > new Date(prev.created_at)) {
        latestMap.set(key, r);
      }
      const d = formatTaiwanDate(r.created_at);
      if (!examLatestDate[r.exam_id] || d > examLatestDate[r.exam_id]) {
        examLatestDate[r.exam_id] = d;
      }
    });

    const operations = Array.from(latestMap.values()).map(r => {
      const info = computeScoreInfo(r);
      return {
        seat: Number(r.seat),
        subjectId: "chinese",
        category: "quiz",
        title: getChineseExamDisplayName(r.exam_id),
        date: examLatestDate[r.exam_id] || formatTaiwanDate(r.created_at),
        maxScore: 100,
        value: info.finalPct,
        note: buildAutoSyncNote(r, info)
      };
    });

    const fnRes = await fetch(`${SUPABASE_CONFIG.URL}/functions/v1/grade-sync`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_CONFIG.ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_CONFIG.ANON_KEY}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "import_operations",
        pw: currentPw,
        overwriteExisting: true,
        includeTestSeats: true,
        operations
      })
    });

    const fnData = await fnRes.json().catch(() => ({}));
    if (!fnRes.ok || !fnData.ok) {
      throw new Error(fnData.error || `grade-sync 失敗 (${fnRes.status})`);
    }

    alert(
      `✅ 已同步 ${targetLabel} 至 402 成績管理系統！\n\n` +
      `・新增成績：${fnData.addedCount ?? 0} 筆\n` +
      `・更新成績：${fnData.updatedCount ?? 0} 筆\n` +
      (fnData.createdAssessments ? `・自動新建小考欄位：${fnData.createdAssessments} 欄\n` : "") +
      (fnData.skippedCount ? `・略過（含已鎖定欄位）：${fnData.skippedCount} 筆\n` : "")
    );
  } catch (err) {
    alert(`同步失敗：${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = prevText;
  }
}
